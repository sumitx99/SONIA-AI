# Keeps the Supabase free-plan project from auto-pausing after 7 days without activity.
# Runs a tiny query every 3 days. Uses the same DB secrets as Render
# (DB_HOST = Supabase pooler host, DB_USER, DB_PASSWORD).
# Scheduled runs only fire from the default branch (main).
name: Supabase keep-alive

on:
  schedule:
    - cron: "30 3 */3 * *" # every 3 days, 03:30 UTC (09:00 IST)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          PGHOST: ${{ secrets.DB_HOST }}
          PGUSER: ${{ secrets.DB_USER }}
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
          PGDATABASE: postgres
          PGPORT: "5432"
          PGSSLMODE: require
        run: |
          if [ -z "$PGHOST" ] || [ -z "$PGUSER" ] || [ -z "$PGPASSWORD" ]; then
            echo "::error::Set repo secrets DB_HOST, DB_USER and DB_PASSWORD"
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 -tAc "select now();"
